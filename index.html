<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cursed Land - Video Investigation Simulator</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #0a0a0c;
            --bg-secondary: #121216;
            --bg-tertiary: #1a1a22;
            --accent-red: #ff3e3e;
            --accent-red-dim: rgba(255, 62, 62, 0.15);
            --accent-gold: #ffd700;
            --accent-gold-dim: rgba(255, 215, 0, 0.15);
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --border-color: #2a2a35;
            --font-main: 'Outfit', sans-serif;
            --font-mono: 'Space Grotesk', sans-serif;
            --glow-red: 0 0 20px rgba(255, 62, 62, 0.4);
            --glow-gold: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) var(--bg-primary);
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-main);
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 62, 62, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 215, 0, 0.03) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* Ambient Glitch / Scanline overlay globally inside player */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.03),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.03)
            );
            background-size: 100% 4px, 6px 100%;
            z-index: 10;
            pointer-events: none;
            opacity: 0.7;
        }

        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(18, 18, 22, 0.8);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .badge-live {
            background-color: var(--accent-red);
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            animation: pulse-live 1.5s infinite;
            font-family: var(--font-mono);
        }

        @keyframes pulse-live {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .logo-title {
            font-family: var(--font-mono);
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(45deg, #fff, var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-title span {
            color: var(--accent-red);
            -webkit-text-fill-color: var(--accent-red);
        }

        .btn-audio {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: var(--font-mono);
        }

        .btn-audio:hover {
            border-color: var(--accent-red);
            box-shadow: var(--glow-red);
            transform: translateY(-2px);
        }

        .btn-audio.active {
            background: var(--accent-red);
            border-color: var(--accent-red);
            color: white;
        }

        /* Main Grid Layout */
        .workspace {
            display: grid;
            grid-template-columns: 1.6fr 1fr;
            height: calc(100vh - 82px);
            min-height: 650px;
        }

        @media (max-width: 1100px) {
            .workspace {
                grid-template-columns: 1fr;
                height: auto;
            }
        }

        /* Left Side: Video Preview Simulator */
        .preview-pane {
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            background: #060608;
            position: relative;
            justify-content: space-between;
        }

        .screen-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        /* Simulated Video Screen */
        .video-screen {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Dynamic Background animations */
        .screen-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #150808 0%, #000000 100%);
            z-index: 1;
            transition: all 1s ease;
        }

        /* Grid Pattern */
        .screen-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 2;
            pointer-events: none;
        }

        /* Interactive visual assets */
        .dust-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 3;
            pointer-events: none;
        }

        /* Scene Elements Container */
        .scene-container {
            width: 90%;
            max-width: 800px;
            height: 80%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
            text-align: center;
            position: relative;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Standardized text overlay styling */
        .dramatic-title {
            font-family: var(--font-mono);
            font-weight: 800;
            font-size: 2.8rem;
            line-height: 1.15;
            letter-spacing: -1px;
            margin-bottom: 25px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(0,0,0,0.8);
            position: relative;
            display: inline-block;
        }

        .dramatic-title.glitch-text::before,
        .dramatic-title.glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
        }

        .dramatic-title.glitch-text::before {
            left: 2px;
            text-shadow: -2px 0 var(--accent-red);
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }

        .dramatic-title.glitch-text::after {
            left: -2px;
            text-shadow: -2px 0 var(--accent-gold);
            clip: rect(85px, 450px, 140px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(15px, 9999px, 66px, 0); }
            10% { clip: rect(85px, 9999px, 5px, 0); }
            20% { clip: rect(34px, 9999px, 115px, 0); }
            30% { clip: rect(70px, 9999px, 95px, 0); }
            40% { clip: rect(12px, 9999px, 45px, 0); }
            50% { clip: rect(98px, 9999px, 120px, 0); }
            60% { clip: rect(64px, 9999px, 10px, 0); }
            70% { clip: rect(5px, 9999px, 85px, 0); }
            80% { clip: rect(110px, 9999px, 55px, 0); }
            90% { clip: rect(25px, 9999px, 130px, 0); }
            100% { clip: rect(80px, 9999px, 75px, 0); }
        }

        @keyframes glitch-anim2 {
            0% { clip: rect(65px, 9999px, 110px, 0); }
            10% { clip: rect(25px, 9999px, 80px, 0); }
            20% { clip: rect(95px, 9999px, 15px, 0); }
            30% { clip: rect(5px, 9999px, 125px, 0); }
            40% { clip: rect(78px, 9999px, 60px, 0); }
            50% { clip: rect(110px, 9999px, 35px, 0); }
            60% { clip: rect(15px, 9999px, 98px, 0); }
            70% { clip: rect(45px, 9999px, 15px, 0); }
            80% { clip: rect(85px, 9999px, 120px, 0); }
            90% { clip: rect(55px, 9999px, 70px, 0); }
            100% { clip: rect(125px, 9999px, 45px, 0); }
        }

        .highlight-red {
            color: var(--accent-red);
            text-shadow: var(--glow-red);
        }

        .highlight-gold {
            color: var(--accent-gold);
            text-shadow: var(--glow-gold);
        }

        /* Document style elements */
        .legal-document-mockup {
            background: #ffffff;
            color: #111116;
            padding: 30px;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            text-align: left;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            max-width: 550px;
            width: 100%;
            transform: rotate(-1.5deg) scale(0.95);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .legal-document-mockup.active {
            transform: rotate(0deg) scale(1.05);
            box-shadow: 0 0 40px rgba(255,255,255,0.15);
        }

        .document-scanner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--accent-red);
            box-shadow: 0 0 15px var(--accent-red);
            animation: scan 3s infinite linear;
            z-index: 10;
        }

        @keyframes scan {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        .doc-header {
            border-bottom: 2px solid #111116;
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }

        .doc-content {
            font-size: 0.78rem;
            line-height: 1.5;
        }

        .doc-highlight {
            background-color: rgba(255, 235, 59, 0.5);
            padding: 2px 4px;
            border-radius: 2px;
            font-weight: bold;
            transition: all 0.3s ease;
            display: inline;
        }

        .doc-highlight.danger-highlight {
            background-color: rgba(255, 62, 62, 0.35);
            border-left: 3px solid var(--accent-red);
            padding-left: 6px;
        }

        /* Overlay Alerts inside screens */
        .warning-board {
            border: 2px solid var(--accent-red);
            background: rgba(26, 6, 6, 0.85);
            backdrop-filter: blur(8px);
            padding: 25px 40px;
            border-radius: 8px;
            box-shadow: var(--glow-red), inset 0 0 20px rgba(255, 62, 62, 0.2);
            animation: pop-warning 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 480px;
            text-align: center;
        }

        @keyframes pop-warning {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .warning-board h3 {
            color: var(--accent-red);
            font-family: var(--font-mono);
            font-size: 2rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .warning-board p {
            color: var(--text-primary);
            font-size: 1.1rem;
            font-weight: 500;
        }

        /* Gameplay simulator graphics */
        .gameplay-mockup {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.35;
            filter: grayscale(40%) contrast(120%);
            transition: transform 10s linear;
        }

        .gameplay-mockup.panning {
            transform: scale(1.2) translate(-20px, -10px);
        }

        /* Crypto Token Visuals */
        .crypto-orbs {
            display: flex;
            gap: 40px;
            margin-bottom: 30px;
        }

        .crypto-orb {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #3a3a3a 0%, #151515 80%, #000 100%);
            border: 2px solid var(--accent-gold);
            box-shadow: var(--glow-gold);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--accent-gold);
            animation: float-orb 4s ease-in-out infinite alternate;
            position: relative;
        }

        .crypto-orb.orb-red {
            border-color: var(--accent-red);
            box-shadow: var(--glow-red);
            color: var(--accent-red);
            animation-delay: -2s;
        }

        @keyframes float-orb {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-15px) rotate(15deg); }
        }

        /* Interactive Timeline bar at the bottom of preview */
        .timeline-controls {
            background-color: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 20;
        }

        .timeline-progress-bar {
            width: 100%;
            height: 6px;
            background: var(--bg-tertiary);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .timeline-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-red), var(--accent-gold));
            width: 0%;
            border-radius: 3px;
            position: absolute;
            top: 0;
            left: 0;
            transition: width 0.1s linear;
        }

        .timeline-markers {
            display: flex;
            justify-content: space-between;
            position: relative;
            top: -10px;
            pointer-events: none;
        }

        .timeline-marker {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--border-color);
            border: 2px solid var(--bg-secondary);
            transition: all 0.3s ease;
        }

        .timeline-marker.active {
            background: var(--accent-red);
            box-shadow: var(--glow-red);
            transform: scale(1.3);
        }

        .playback-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-play-action {
            background: var(--accent-red);
            border: none;
            color: white;
            padding: 10px 22px;
            border-radius: 6px;
            font-weight: 700;
            font-family: var(--font-mono);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-play-action:hover {
            box-shadow: var(--glow-red);
            transform: translateY(-1px);
        }

        .btn-play-action:active {
            transform: translateY(1px);
        }

        .playback-time {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .playback-navs {
            display: flex;
            gap: 10px;
        }

        .btn-nav-arrow {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 38px;
            height: 38px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .btn-nav-arrow:hover {
            border-color: var(--text-primary);
            background: var(--border-color);
        }

        /* Right Side: Production Script & Storyboard Viewer */
        .script-pane {
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            overflow-y: auto;
        }

        .pane-header {
            padding: 20px 30px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background: var(--bg-secondary);
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pane-title {
            font-family: var(--font-mono);
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pane-title svg {
            color: var(--accent-red);
        }

        .btn-copy-all {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-copy-all:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
        }

        .script-timeline {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .scene-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .scene-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateX(4px);
        }

        .scene-card.active {
            border-color: var(--accent-red);
            background: rgba(26, 26, 35, 0.9);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .scene-card.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 15px;
            height: calc(100% - 30px);
            width: 4px;
            background: var(--accent-red);
            border-radius: 0 4px 4px 0;
        }

        .scene-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.75rem;
            font-family: var(--font-mono);
            font-weight: bold;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .scene-duration {
            color: var(--accent-gold);
        }

        .scene-name {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .scene-card.active .scene-name {
            color: var(--accent-red);
        }

        .scene-section-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            font-weight: bold;
            color: var(--text-secondary);
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .scene-visual-desc {
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            border-left: 2px solid var(--border-color);
            margin-bottom: 12px;
            color: #d0d0e0;
            line-height: 1.4;
        }

        .scene-card.active .scene-visual-desc {
            border-left-color: var(--accent-gold);
        }

        .scene-vo-desc {
            background: rgba(255, 62, 62, 0.03);
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 0.9rem;
            border-left: 2px solid var(--accent-red-dim);
            color: var(--text-primary);
            line-height: 1.5;
            font-weight: 500;
        }

        .scene-card.active .scene-vo-desc {
            border-left-color: var(--accent-red);
            background: rgba(255, 62, 62, 0.05);
        }

        /* Floating Interactive Teleprompter toggle */
        .floating-prompter {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 55px;
            height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            z-index: 200;
        }

        .floating-prompter:hover {
            border-color: var(--accent-gold);
            transform: scale(1.1);
            box-shadow: var(--glow-gold);
        }

        /* Prompter Modal Drawer */
        .prompter-modal {
            position: fixed;
            bottom: 100px;
            right: 30px;
            width: 350px;
            background: rgba(18, 18, 22, 0.95);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(16px);
            z-index: 199;
            transform: translateY(20px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .prompter-modal.open {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .prompter-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--accent-gold);
        }

        .prompter-body {
            padding: 20px;
            max-height: 250px;
            overflow-y: auto;
            font-size: 1.1rem;
            line-height: 1.6;
            text-align: center;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Background animated dust canvas */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;

        // Web Audio engine for background atmospheric movie music
        class SoundEngine {
            constructor() {

                this.masterVolume = null;

                this.tickingInterval = null;
                this.isPlaying = false;
            }

            init() {
                if (this.ctx) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
                this.masterVolume = this.ctx.createGain();
                this.masterVolume.gain.setValueAtTime(0.25, this.ctx.currentTime);
                this.masterVolume.connect(this.ctx.destination);
            }

            playSwell() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(55, this.ctx.currentTime); // Low A bass note
                osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 1.5);
                
                gain.gain.setValueAtTime(0, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.5, this.ctx.currentTime + 0.5);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 2.5);

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(200, this.ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 1.2);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.masterVolume);

                osc.start();
                osc.stop(this.ctx.currentTime + 3);
            }

            playGlitchNoise() {
                if (!this.ctx) return;
                const bufferSize = this.ctx.sampleRate * 0.15; // 150ms of glitch
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noiseNode = this.ctx.createBufferSource();
                noiseNode.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(800, this.ctx.currentTime);
                filter.frequency.linearRampToValueAtTime(2200, this.ctx.currentTime + 0.1);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);

                noiseNode.connect(filter);
                filter.connect(gain);
                gain.connect(this.masterVolume);

                noiseNode.start();
            }

            playClickBeep() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, this.ctx.currentTime);
                
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(this.masterVolume);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            startAtmosphere() {
                this.init();
                if (this.isPlaying) return;
                this.isPlaying = true;
                
                // Continuous low atmospheric drone
                this.droneOsc = this.ctx.createOscillator();
                this.droneGain = this.ctx.createGain();
                this.droneOsc.type = 'sine';
                this.droneOsc.frequency.setValueAtTime(45, this.ctx.currentTime); // very low bass rumble
                
                // Lowpass filter to keep it super dark and muddy

                this.droneFilter.type = 'lowpass';
                this.droneFilter.frequency.setValueAtTime(90, this.ctx.currentTime);

                this.droneGain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                
                this.droneOsc.connect(this.droneFilter);
                this.droneFilter.connect(this.droneGain);
                this.droneGain.connect(this.masterVolume);
                
                this.droneOsc.start();

                // Periodic ominous synth tick representing investigative clocks
                this.tickingInterval = setInterval(() => {
                    this.playClickBeep();
                }, 1000);
            }

            stopAtmosphere() {
                if (!this.isPlaying) return;
                this.isPlaying = false;
                if (this.droneOsc) {
                    try { this.droneOsc.stop(); } catch(e) {}
                }
                if (this.tickingInterval) {
                    clearInterval(this.tickingInterval);
                }
            }
        }

            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 100;
                this.size = Math.random() * 3 + 1;
                this.speedY = -(Math.random() * 1.5 + 0.5);
                this.opacity = Math.random() * 0.5 + 0.1;
                this.color = Math.random() > 0.7 ? '#ffd700' : '#ff3e3e';
            }

            update() {
                this.y += this.speedY;
                if (this.y < 0) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.fill();
            }
        }

            });

            audioSystemOn = !audioSystemOn;
            if (audioSystemOn) {
                audio.startAtmosphere();
                audioToggleBtn.classList.add('active');
                audioToggleBtn.querySelector('span').innerText = 'Sunet Cinematic ACTIVAT';
            } else {
                audio.stopAtmosphere();
                audioToggleBtn.classList.remove('active');
                audioToggleBtn.querySelector('span').innerText = 'Activează Sunet Cinematic';
            }
        });

        // Transition logic between scenes
        function goToScene(index) {
            currentSceneIndex = index;
            const currentScene = scenes[currentSceneIndex];
            
            // Update active timeline cards
            document.querySelectorAll('.scene-card').forEach(card => card.classList.remove('active'));
            document.getElementById(`scene-card-${index}`).classList.add('active');
            
            // Render active scene visuals
            currentScene.render(sceneRenderContainer);
            
            // Scroll to active card in script side panel
            const cardEl = document.getElementById(`scene-card-${index}`);
            cardEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            // Update teleprompter
            prompterText.innerHTML = `<strong>Scena ${currentScene.id}:</strong> ${currentScene.vo}`;

            // Update info display
            playbackTimeText.innerText = `SCENA ${currentScene.id} / ${scenes.length}`;
            
            // Trigger quick glitch sound
            if (audioSystemOn) {
                audio.playGlitchNoise();
            }

            // Sync visual backdrop to match specific scene vibe
            const screenBg = document.getElementById('screenBg');
            const gameplayVisual = document.getElementById('gameplayVisual');
            if (currentScene.id === 1) {
                screenBg.style.background = 'radial-gradient(circle, #200404 0%, #000 100%)';
                gameplayVisual.style.opacity = '0.35';
            } else if (currentScene.id === 3 || currentScene.id === 6) {
                screenBg.style.background = 'radial-gradient(circle, #251c04 0%, #000 100%)';
                gameplayVisual.style.opacity = '0.2';
            } else {
                screenBg.style.background = 'radial-gradient(circle, #09090b 0%, #000 100%)';
                gameplayVisual.style.opacity = '0.1';
            }

            // Calculate duration in ms
            const seconds = parseInt(currentScene.duration);
            totalDurationCurrentScene = seconds * 1000;
            sceneTimeLeft = totalDurationCurrentScene;
            updateProgressBar();
        }

        // Timeline Progress updates
        function updateProgressBar() {
            const percent = ((totalDurationCurrentScene - sceneTimeLeft) / totalDurationCurrentScene) * 100;
            timelineFill.style.width = `${percent}%`;
        }

        // Manual controls
        btnPrev.addEventListener('click', () => {
            if (currentSceneIndex > 0) {
                goToScene(currentSceneIndex - 1);
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentSceneIndex < scenes.length - 1) {
                goToScene(currentSceneIndex + 1);
            } else {
                goToScene(0); // Loop back
            }
        });

        // Automatic autoplay player engine loop
        function startPlayback() {
            isPlaying = true;
            playIcon.innerHTML = `<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>`;
            playText.innerText = "OPREȘTE SIMULAREA";
            
            const intervalTime = 100; // Tick every 100ms
            playbackInterval = setInterval(() => {
                sceneTimeLeft -= intervalTime;
                updateProgressBar();

                if (sceneTimeLeft <= 0) {
                    if (currentSceneIndex < scenes.length - 1) {
                        goToScene(currentSceneIndex + 1);
                    } else {
                        // Restart at end
                        goToScene(0);
                    }
                }
            }, intervalTime);
        }

        function stopPlayback() {
            isPlaying = false;
            playIcon.innerHTML = `<polygon points="5 3 19 12 5 21 5 3"></polygon>`;
            playText.innerText = "PORNEȘTE AUTOMAT";
            clearInterval(playbackInterval);
        }

        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                stopPlayback();
            } else {
                startPlayback();
                // Ensure audio is on
                if (!audioSystemOn) {
                    audioToggleBtn.click();
                }
            }
        });

        // Initialize First Scene View
        goToScene(0);

        // Copy all functionality for copy-pasting to CapCut / Premiere Pro
        const btnCopyAll = document.getElementById('btnCopyAll');
        const copyToast = document.getElementById('copyToast');

        btnCopyAll.addEventListener('click', () => {
            let fullText = "SCRIPT INVESTIGAȚIE: THE CURSED LAND\n=========================================\n\n";
            
            scenes.forEach(scene => {
                fullText += `SCENA ${scene.id}: ${scene.name} (${scene.duration})\n`;
                fullText += `-------------------------------------------------\n`;
                fullText += `VIZUAL / CADRU:\n${scene.visual}\n\n`;
                fullText += `VOICE-OVER / REPLICĂ (ROMÂNĂ):\n"${scene.vo}"\n\n\n`;
            });
            
            navigator.clipboard.writeText(fullText).then(() => {
                copyToast.classList.add('show');
                setTimeout(() => {
                    copyToast.classList.remove('show');
                }, 2500);
            }).catch(err => {
                alert("Eroare la copiere, vă rugăm selectați scriptul din listă.");
            });
        });
    </script>
</body>
</html>
